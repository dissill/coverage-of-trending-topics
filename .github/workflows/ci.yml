name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check
        run: python -m py_compile main.py news_sources.py
      - name: Validate metadata / config JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("_conf_schema.json").read_text(encoding="utf-8"))
          print("config schema ok")
          PY
