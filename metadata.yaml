name: astrbot_plugin_daily_news
display_name: 每日新闻简报
desc: "每晚 23:00 抓取国内公开新闻源，按「政策/经济/民生/国际/科技/社会」分类生成简短要闻，每条单独一条消息、最后汇总政策与资金动向，并自动跳过最近几天重复报道过的新闻；日报开头附所在城市明天的天气与穿衣、带伞建议；支持聊天里直接加关注主题（AI、股市、新能源车等），周报周日 23:10 出趋势分析；日报/周报末尾会提示可解释不懂的关键词。"
help: "命令：/日报 马上生成今天的日报（开头附明天天气）；/天气 看明天天气；/周报 生成最近 7 天周报；/关注 主题 添加关注；/关注列表 查看；/取消关注 主题 删除；/新闻源 检测新闻源；/新闻设置 查看配置；/新闻帮助。默认每天 23:00 自动私聊推送。"
version: v1.3.0
